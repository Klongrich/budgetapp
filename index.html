<!DOCTYPE html>
<html>
	<head>
		<title> I am broke budgeting app </title>
		<link href="./styles.css" rel="stylesheet">
		
		<script src="script.js" defer></script>
	</head>
	
	<body>
		<div class="main">
			<h2> I am broke budgeting app </h2>
			<form id="form" action="index.html" method=POST>
				<label> Location: </label>
				<input type="text" id="location">
				<br /> <br />
				
				<label> Amount:  </label>
				<input type="text" id="price">
				<br /> <br />
				
				<label> Iteam:  </label>
				<input type="text" id="iteam">
				<br /> <br />
				
				<p>Spent today: $<span id="display-amount"> </p>
				<input type="submit" value="add">
			</form>
			
			<div class="iteam-container">
				<div class="iteam">
					<p> <b> Iteam: </b> <span id="iteam-1"> </span> </p>
					<p> <b> Amount: </b> <span id="amount-1"> </span> </p>
					<p> <b> Location: </b> <span id="location-1"> </span> </p>
				</div>
			
				<div class="iteam">
					<p> Iteam: <span id="iteam-2"> </span> </p>
					<p> amount: <span id="amount-2"> </span> </p>
					<p> location: <span id="location-2"> </span> </p>
				</div>
			
				<div class="iteam">
					<p> Iteam: <span id="iteam-3"> </span> </p>
					<p> amount: <span id="amount-3"> </span> </p>
					<p> location: <span id="location-3"> </span> </p>
				</div>
			
				<div class="iteam">
					<p> Iteam: <span id="iteam-4"> </span> </p>
					<p> amount: <span id="amount-4"> </span> </p>
					<p> location: <span id="location-4"> </span> </p>
				</div>
			</div>
			
			<br />
			<!-- <p> cost per meal </p>
			<p> gas cost </p> -->
			<button id="reset"> reset </button>
			<p>Today's date is: <span id="current-date"></span></p>
			
		</div>
	</body>
</html>
